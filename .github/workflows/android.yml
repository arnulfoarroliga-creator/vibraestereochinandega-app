
name: Crear APK de Vibra Estéreo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar aplicación Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp index.html www/index.html
          echo '{"appId":"com.vibraestereo.chinandega","appName":"Vibra Estéreo","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Construir APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-Estereo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
